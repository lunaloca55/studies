const NavItem=({icon:Icon,label,active,onClick,badge})=>(<button onClick={onClick} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all ${active?'bg-indigo-600 text-white':'text-gray-600 hover:bg-gray-100'}`}><Icon size={20}/><span className="font-medium">{label}</span>{badge&&<span className="ml-auto bg-red-500 text-white text-xs px-2 py-0.5 rounded-full">{badge}</span>}</button>);

const ScoreBadge=({score})=>{const c=score>=85?'bg-emerald-100 text-emerald-700':score>=70?'bg-amber-100 text-amber-700':'bg-gray-100 text-gray-600';return<span className={`px-2 py-1 rounded-full text-sm font-semibold ${c}`}>{score}</span>;};

const StatusDot=({status})=>{const c={hot:'bg-red-500',warm:'bg-amber-500',cool:'bg-blue-400'};return<span className={`w-2 h-2 rounded-full ${c[status]}`}/>;};

const AppStatusBadge=({status})=>{const s={complete:'bg-emerald-100 text-emerald-700',incomplete:'bg-amber-100 text-amber-700',review:'bg-blue-100 text-blue-700',pending:'bg-gray-100 text-gray-600',not_started:'bg-red-100 text-red-700'};const l={complete:'Complete',incomplete:'Incomplete',review:'Ready for Review',pending:'Pending',not_started:'Not Started'};return<span className={`px-2 py-1 rounded-full text-xs font-semibold ${s[status]}`}>{l[status]}</span>;};

const QualityMeter=({score,size='md'})=>{const c=score>=85?'bg-emerald-500':score>=70?'bg-amber-500':'bg-red-500';const h=size==='sm'?'h-1.5':'h-2';return<div className={`w-full bg-gray-200 rounded-full ${h}`}><div className={`${c} ${h} rounded-full transition-all`} style={{width:`${score}%`}}/></div>;};

const SectionStatus=({status,score})=>{const i={complete:<CheckCircle size={14} className="text-emerald-500"/>,incomplete:<AlertCircle size={14} className="text-amber-500"/>,pending:<Clock size={14} className="text-gray-400"/>,not_started:<AlertCircle size={14} className="text-red-500"/>};return<div className="flex items-center gap-2">{i[status]}{score>0&&<span className="text-xs text-gray-500">{score}%</span>}</div>;};

const CampaignStatusBadge=({status})=>{const s={active:'bg-emerald-100 text-emerald-700',paused:'bg-amber-100 text-amber-700',scheduled:'bg-blue-100 text-blue-700',draft:'bg-gray-100 text-gray-600'};return<span className={`px-2 py-1 rounded-full text-xs font-semibold ${s[status]}`}>{status.charAt(0).toUpperCase()+status.slice(1)}</span>;};

const SentimentBadge=({sentiment})=>{const s={positive:'bg-emerald-100 text-emerald-700',neutral:'bg-gray-100 text-gray-600',cold:'bg-blue-100 text-blue-700'};return<span className={`px-2 py-0.5 rounded-full text-xs font-medium ${s[sentiment]}`}>{sentiment}</span>;};

const ChannelIcon=({channel,size=16})=>channel==='email'?<Mail size={size}/>:<MessageCircle size={size}/>;

const App=()=>{

const[selectedConversation,setSelectedConversation]=useState(null);

const[messageChannel,setMessageChannel]=useState('email');
const[aiResponse,setAiResponse]=useState('');
const[isGenerating,setIsGenerating]=useState(false);
const[activeAiTool,setActiveAiTool]=useState(null);

const simulateAI=(tool,prospect)=>{setIsGenerating(true);setActiveAiTool(tool);setTimeout(()=>{const r={'draft-email':`Hi ${prospect.name.split(' ')[0]},\n\nThank you for your interest in our ${prospect.interest} program!\n\nBest,\nYour Enrollment Counselor`,'lead-score':`**Lead Score: ${prospect.score}/100**\n\nStrong engagement with ${prospect.events.length} events attended.`};setAiResponse(r[tool]||'Analysis complete.');setIsGenerating(false);},1500);};

const AIResponsePanel=()=>(<div className="bg-white rounded-xl border border-gray-200 p-6"><div className="flex items-center gap-2 mb-4"><div className="w-8 h-8 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center"><Sparkles size={16} className="text-white"/></div><h3 className="font-semibold text-gray-900">AI Assistant</h3></div>{isGenerating?<div className="flex items-center gap-3 text-gray-500"><div className="animate-spin w-5 h-5 border-2 border-indigo-600 border-t-transparent rounded-full"/><span>Generating...</span></div>:aiResponse?<div className="prose prose-sm max-w-none"><pre className="whitespace-pre-wrap font-sans text-gray-700 text-sm leading-relaxed bg-gray-50 p-4 rounded-lg max-h-96 overflow-y-auto">{aiResponse}</pre><div className="flex gap-2 mt-4"><button className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium"><Send size={14}/>Use This</button></div></div>:<p className="text-gray-500 text-sm">Select an item and choose an AI action to get started.</p>}</div>);

-xs text-amber-600 mt-1">No contact in 5+ days</p></div></div></div><div className="p-4 bg-emerald-50 border border-emerald-200 rounded-lg"><div className="flex items-start gap-3"><TrendingUp size={18} className="text-emerald-600 mt-0.5"/><div><p className="text-sm font-medium text-emerald-800">CS prospects converting 23% higher</p></div></div></div></div></div></div></div>);

const AnalyticsView=()=>{const totalSpend=sourceData.reduce((a,s)=>a+s.cost,0);const totalLeads=sourceData.reduce((a,s)=>a+s.leads,0);const avgCPL=totalSpend/totalLeads;const FunnelBar=({stage,index})=>{const w=(stage.prospects/funnelData[0].prospects)*100;return<div className="flex items-center gap-4"><div className="w-40 text-right"><p className="font-medium text-gray-900">{stage.stage}</p><p className="text-xs text-gray-500">{stage.avgDays>0?`Avg ${stage.avgDays} days`:'Entry'}</p></div><div className="flex-1 relative"><div className="h-12 rounded-lg flex items-center" style={{width:`${w}%`,backgroundColor:stage.color}}><span className="text-white font-bold ml-3">{stage.prospects.toLocaleString()}</span></div>{index>0&&<div className="absolute -top-1 right-0 flex items-center gap-1 text-xs"><TrendingDown size={12} className="text-red-500"/><span className="text-red-600 font-medium">{stage.dropoff}%</span></div>}</div><div className="w-20 text-right"><p className="font-bold text-gray-900">{stage.percentage}%</p></div></div>;};const MetricCard=({title,value,subtitle,trend,trendUp,icon:Icon})=>(<div className="bg-white rounded-xl border border-gray-200 p-5"><div className="flex items-start justify-between mb-2"><div className="p-2 bg-gray-100 rounded-lg"><Icon size={20} className="text-gray-600"/></div>{trend&&<span className={`flex items-center gap-1 text-sm font-medium ${trendUp?'text-emerald-600':'text-red-600'}`}>{trendUp?<TrendingUp size={14}/>:<TrendingDown size={14}/>}{trend}</span>}</div><p className="text-2xl font-bold text-gray-900">{value}</p><p className="text-sm text-gray-500">{title}</p>{subtitle&&<p className="text-xs text-gray-400 mt-1">{subtitle}</p>}</div>);return<div className="space-y-6"><div className="flex items-center justify-between"><div className="flex gap-2">{['funnel','sources','trends'].map(t=>(<button key={t} onClick={()=>setAnalyticsTab(t)} className={`px-4 py-2 rounded-lg font-medium text-sm ${analyticsTab===t?'bg-indigo-600 text-whit sourceData.map(s=>(<tr key={s.source} className="hover:bg-gray-50"><td className="px-6 py-4 font-medium text-gray-900">{s.source}</td><td className="px-6 py-4 text-right text-gray-600">{s.leads.toLocaleString()}</td><td className="px-6 py-4 text-right text-gray-600">{s.cost>0?`$${s.cost.toLocaleString()}`:'-'}</td><td className="px-6 py-4 text-right"><span className={`font-medium ${s.cpl>0?(s.cpl<35?'text-emerald-600':'text-amber-600'):'text-gray-400'}`}>{s.cpl>0?`$${s.cpl.toFixed(2)}`:'-'}</span></td><td className="px-6 py-4 text-right"><span className={`font-semibold ${s.roi?(s.roi>=4?'text-emerald-600':'text-amber-600'):'text-gray-400'}`}>{s.roi?`${s.roi.toFixed(1)}x`:'-'}</span></td></tr>))}</tbody></table></div>}{analyticsTab==='trends'&&<div className="grid grid-cols-2 gap-6"><div className="bg-white rounded-xl border border-gray-200 p-6"><h3 className="font-semibold text-gray-900 mb-4">Monthly Volume Trends</h3><div className="h-64 flex items-end justify-between gap-2">{monthlyTrends.map(m=>{const max=Math.max(...monthlyTrends.map(x=>x.inquiries));return<div key={m.month} className="flex-1 flex flex-col items-center gap-1"><div className="w-full flex flex-col gap-1"><div className="bg-indigo-500 rounded-t" style={{height:`${(m.inquiries/max)*180}px`}}/><div className="bg-purple-500" style={{height:`${(m.applications/max)*180}px`}}/><div className="bg-emerald-500 rounded-b" style={{height:`${(m.enrolled/max)*180}px`}}/></div><span className="text-xs text-gray-500 mt-2">{m.month}</span></div>;})}</div><div className="flex justify-center gap-6 mt-4 pt-4 border-t"><div className="flex items-center gap-2"><div className="w-3 h-3 rounded bg-indigo-500"/><span className="text-sm text-gray-600">Inquiries</span></div><div className="flex items-center gap-2"><div className="w-3 h-3 rounded bg-purple-500"/><span className="text-sm text-gray-600">Applications</span></div><div className="flex items-center gap-2"><div className="w-3 h-3 rounded bg-emerald-500"/><span className="text-sm text-gray-600">Enrolled</span></div></div></div><div className="bg-white rounded-xl border border-gray-200 p-6"><h3 className="font-semibold text-gray-900 mb-4">Key Metrics Summary</h3><div className="grid grid-cols-3 gap-4">{[{v:'12.4K',l:'Total Reach',c:'text-indigo-600'},{v:'4.2K',l:'Inquiries',c:'text-purple-600'},{v:'892',l:'Applications',c:'text-pink-600'},{v:'412',l:'Enrolled',c:'text-emerald-600'},{v:'$98K',l:'Spend',c:'text-amber-600'},{v:'$18.2M',l:'Projected LTV',c:'text-teal-600'}].map((m,i)=>(<div key={i} className="bg-gray-50 rounded-xl p-4 text-center"><p className={`text-2xl font-bold ${m.c}`}>{m.v}</p><p className="text-sm text-gray-500">{m.l}</p></div>))}</div></div></div>}</div>;};

assName="relative p-2 text-gray-500 hover:bg-gray-100 rounded-lg"><Bell size={20}/><span className="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"/></button><div className="w-10 h-10 bg-gradient-to-br from-indigo-400 to-purple-500 rounded-full flex items-center justify-center text-white font-semibold">JD</div></div></header>{activeNav==='dashboard'&&<Dashboard/>}{activeNav==='prospects'&&<ProspectsView/>}{activeNav==='apps'&&<ApplicationsView/>}{activeNav==='comms'&&<CommunicationsView/>}{activeNav==='campaigns'&&<CampaignsView/>}{activeNav==='analytics'&&<AnalyticsView/>}{!['dashboard','prospects','apps','comms','campaigns','analytics'].includes(activeNav)&&<div className="bg-white rounded-xl border border-gray-200 p-12 text-center"><BookOpen size={48} className="mx-auto text-gray-300 mb-4"/><p className="text-gray-500">This section is coming soon</p></div>}</main></div>);
