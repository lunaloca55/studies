        <span className={`${active ? 'bg-white text-indigo-600' : 'bg-red-500 text-white'} text-xs font-bold px-2 py-0.5 rounded-full`}>
          {badge}
        </span>
      )}
    </button>
  );

  const MetricCard = ({ title, value, subtitle, trend, trendUp, icon: Icon, color = 'indigo', sparkline }) => (
    <div className="bg-white rounded-2xl border border-gray-200 p-6 hover:shadow-xl transition-all duration-300 animate-slide-in">
      <div className="flex items-start justify-between mb-4">
        <div className={`p-3 bg-gradient-to-br from-${color}-100 to-${color}-200 rounded-xl`}>
          <Icon size={24} className={`text-${color}-600`} />
        </div>
        {trend && (
          <span className={`flex items-center gap-1 text-sm font-semibold px-2 py-1 rounded-lg ${
            trendUp ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'
          }`}>
            {trendUp ? <icons.TrendingUp size={14} /> : <icons.TrendingDown size={14} />}
            {trend}
          </span>
        )}
      </div>
      <div>
        <p className="text-3xl font-bold text-gray-900 mb-1">{value}</p>
        <p className="text-sm font-medium text-gray-600">{title}</p>
        {subtitle && <p className="text-xs text-gray-400 mt-2">{subtitle}</p>}
      </div>
      {sparkline && (
        <div className="mt-4 h-8 flex items-end gap-1">
          {sparkline.map((val, i) => (
            <div 
              key={i} 
              className={`flex-1 bg-gradient-to-t from-${color}-500 to-${color}-300 rounded-t opacity-${30 + (val * 70)}`}
              style={{ height: `${val * 100}%` }}
            />
          ))}
        </div>
      )}
    </div>
  );

  const StatCard = ({ label, value, change, changeLabel, icon: Icon, color }) => (
    <div className="bg-white rounded-2xl border border-gray-200 p-6 hover:shadow-xl transition-all">
      <div className="flex items-center justify-between mb-4">
        <div className={`p-3 rounded-xl bg-gradient-to-br from-${color}-100 to-${color}-200`}>
          <Icon size={24} className={`text-${color}-600`} />
        </div>
        {change !== undefined && (
          <div className={`flex items-center gap-1 text-sm font-semibold ${change > 0 ? 'text-emerald-600' : 'text-red-600'}`}>
            {change > 0 ? <icons.TrendingUp size={16} /> : <icons.TrendingDown size={16} />}
            <span>{Math.abs(change)}%</span>
          </div>
        )}
      </div>
      <div>
        <p className="text-3xl font-bold text-gray-900 font-display">{value}</p>
        <p className="text-sm font-medium text-gray-600 mt-1">{label}</p>
        {changeLabel && <p className="text-xs text-gray-400 mt-2">{changeLabel}</p>}
      </div>
    </div>
  );

  // Main Dashboard View
  const Dashboard = () => {
    const totalEnrolled = programs.reduce((sum, p) => sum + p.enrolled, 0);
    const totalTarget = programs.reduce((sum, p) => sum + p.target, 0);
    const totalApps = programs.reduce((sum, p) => sum + p.apps, 0);
    const progressPercent = (totalEnrolled / totalTarget) * 100;

    return (
      <div className="space-y-6">
        {/* Top Banner */}
        <div className="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 rounded-2xl p-8 text-white">
          <div className="flex items-center justify-between">
            <div>
              <h3 className="text-2xl font-bold font-display mb-2">Enrollment Dashboard</h3>
              <p className="text-indigo-100">Real-time insights across all programs</p>
            </div>
            <div className="text-right">
              <p className="text-indigo-100 text-sm mb-1">Overall Progress</p>
              <p className="text-5xl font-bold font-display">{progressPercent.toFixed(1)}%</p>
              <p className="text-sm text-indigo-200 mt-1">{totalEnrolled} / {totalTarget} enrolled</p>
            </div>
          </div>
        </div>

        {/* Key Metrics Grid */}
        <div className="grid grid-cols-4 gap-4">
          <StatCard
            label="Total Enrolled"
            value={totalEnrolled}
            change={8.2}
            changeLabel="vs last month"
            icon={icons.UserCheck}
            color="indigo"
          />
          <StatCard
            label="Active Prospects"
            value="4,234"
            change={12.4}
            changeLabel="vs last week"
            icon={icons.Users}
            color="purple"
          />
          <StatCard
            label="Applications"
            value={totalApps}
            change={-3.2}
            changeLabel="vs last month"
            icon={icons.FileText}
            color="pink"
          />
          <StatCard
            label="Projected Revenue"
            value="$18.5M"
            change={5.7}
            changeLabel="vs target"
            icon={icons.DollarSign}
            color="emerald"
          />
        </div>

        {/* Enrollment Progress by Program */}
        <div className="bg-white rounded-2xl border border-gray-200 p-6">
          <div className="flex items-center justify-between mb-6">
            <div>
              <h3 className="font-bold text-gray-900 text-lg font-display">Enrollment Progress by Program</h3>
              <p className="text-sm text-gray-500">Target achievement and performance metrics</p>
            </div>
            <button className="flex items-center gap-2 px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm font-medium transition-colors">
              <icons.Download size={16} />
              Export Report
            </button>
          </div>
          <div className="space-y-4">
            {programs.map(program => {
              const percent = (program.enrolled / program.target) * 100;
              const status = percent >= 100 ? 'complete' : percent >= 80 ? 'good' : percent >= 60 ? 'fair' : 'behind';
              const statusColor = {
                complete: 'emerald',
                good: 'blue',
                fair: 'amber',
                behind: 'red'
              }[status];

              return (
                <div key={program.id} className="group hover:bg-gray-50 p-4 rounded-xl transition-colors">
                  <div className="flex items-center justify-between mb-3">
                    <div className="flex-1">
                      <p className="font-semibold text-gray-900">{program.name}</p>
                      <div className="flex items-center gap-4 mt-1">
                        <p className="text-xs text-gray-500">{program.school}</p>
                        <span className="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded">{program.format}</span>
                        <span className="text-xs text-gray-400">#{program.rank} ranked</span>
                      </div>
                    </div>
                    <div className="text-right">
                      <p className="font-bold text-gray-900 text-lg">{program.enrolled} <span className="text-gray-400 font-normal">/ {program.target}</span></p>
                      <p className={`text-xs font-semibold text-${statusColor}-600`}>
                        {percent.toFixed(1)}% complete
                      </p>
                    </div>
                  </div>
                  <div className="relative h-3 bg-gray-100 rounded-full overflow-hidden">
                    <div
                      className={`absolute inset-y-0 left-0 bg-gradient-to-r from-${statusColor}-500 to-${statusColor}-600 rounded-full transition-all duration-500`}
                      style={{ width: `${Math.min(percent, 100)}%` }}
                    />
                  </div>
                  <div className="flex items-center justify-between mt-2 text-xs text-gray-500">
                    <span>{program.apps} applications received</span>
                    <span>${(program.tuition).toLocaleString()} tuition</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* Activity & Insights Grid */}
        <div className="grid grid-cols-2 gap-6">
          {/* Recent Activity */}
          <div className="bg-white rounded-2xl border border-gray-200 p-6">
            <div className="flex items-center justify-between mb-4">
              <h3 className="font-bold text-gray-900 font-display">Recent Activity</h3>
              <button className="text-sm text-indigo-600 hover:text-indigo-700 font-medium">View all →</button>
            </div>
            <div className="space-y-4">
              {[
                { action: 'New inquiry received', detail: 'Sarah Chen - MBA Online', time: '5 min ago', icon: icons.UserPlus, color: 'indigo' },
                { action: 'Application completed', detail: 'Michael Rodriguez - MS Data Science', time: '23 min ago', icon: icons.FileCheck, color: 'emerald' },
                { action: 'Deposit payment received', detail: 'Emily Thompson - MSN Online', time: '1 hour ago', icon: icons.CheckCircle, color: 'green' },
                { action: 'Follow-up needed', detail: '12 prospects require attention', time: '2 hours ago', icon: icons.AlertCircle, color: 'amber' },
                { action: 'Marketing campaign launched', detail: 'Summer Start 2025 Promotion', time: '3 hours ago', icon: icons.Send, color: 'purple' },
                { action: 'Workflow completed', detail: 'Inquiry Nurture - 89 contacts', time: '4 hours ago', icon: icons.CheckCircle, color: 'blue' }
              ].map((activity, i) => (
                <div key={i} className="flex items-start gap-3 p-3 rounded-lg hover:bg-gray-50 transition-colors">
                  <div className={`p-2 bg-${activity.color}-100 rounded-lg flex-shrink-0`}>
                    <activity.icon size={18} className={`text-${activity.color}-600`} />
                  </div>
                  <div className="flex-1 min-w-0">
                    <p className="text-sm font-medium text-gray-900">{activity.action}</p>
                    <p className="text-xs text-gray-500 truncate">{activity.detail}</p>
                  </div>
                  <span className="text-xs text-gray-400 flex-shrink-0">{activity.time}</span>
                </div>
              ))}
            </div>
          </div>

          {/* AI Insights */}
          <div className="bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-600 rounded-2xl p-6 text-white">
            <div className="flex items-center gap-2 mb-4">
              <icons.Brain size={24} />
              <h3 className="font-bold text-lg font-display">AI-Powered Insights</h3>
            </div>
            <div className="space-y-3">
              {[
                { type: 'opportunity', title: 'High-Value Channel', desc: 'Google Ads Search driving 8.2x ROI. Recommend 20% budget increase for 150 additional conversions.', icon: icons.Sparkles },
                { type: 'alert', title: 'At-Risk Program', desc: 'MS Cybersecurity tracking 13% below target. 22 admitted students at deposit risk. Launch personalized yield campaign.', icon: icons.AlertTriangle },
                { type: 'win', title: 'Automation Success', desc: 'Email workflows achieving 42.3x ROI. "Admitted Student Yield" sequence showing 65% conversion rate.', icon: icons.TrendingUp },
                { type: 'prediction', title: 'Enrollment Forecast', desc: 'ML model predicts 95% confidence of reaching 395 total enrollments by Fall 2025 start date.', icon: icons.Brain }
              ].map((insight, i) => (
                <div key={i} className="bg-white/10 backdrop-blur-sm rounded-xl p-4 hover:bg-white/20 transition-colors">
                  <div className="flex items-start gap-2 mb-2">
                    <insight.icon size={18} className="mt-0.5 flex-shrink-0" />
                    <p className="text-sm font-semibold">{insight.title}</p>
                  </div>
                  <p className="text-sm text-indigo-100">{insight.desc}</p>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* Quick Actions */}
        <div className="grid grid-cols-4 gap-4">
          {[
            { label: 'Create Campaign', icon: icons.Megaphone, color: 'indigo', desc: 'Launch new marketing campaign' },
            { label: 'Review Applications', icon: icons.FileText, color: 'purple', desc: 'Process pending applications' },
            { label: 'Send Bulk Message', icon: icons.Send, color: 'pink', desc: 'Email prospects and students' },
            { label: 'Export Analytics', icon: icons.Download, color: 'emerald', desc: 'Download performance reports' }
          ].map((action, i) => (
            <button key={i} className={`bg-white border-2 border-${action.color}-200 hover:border-${action.color}-400 hover:shadow-xl rounded-2xl p-6 text-left transition-all group`}>
              <div className={`p-3 bg-gradient-to-br from-${action.color}-100 to-${action.color}-200 rounded-xl inline-flex mb-3 group-hover:scale-110 transition-transform`}>
                <action.icon size={24} className={`text-${action.color}-600`} />
              </div>
              <p className="font-semibold text-gray-900 mb-1">{action.label}</p>
              <p className="text-xs text-gray-500">{action.desc}</p>
            </button>
          ))}
        </div>
      </div>
    );
  };

  return (
    <div className="min-h-screen flex">
      {/* Sidebar */}
      <aside className={`${sidebarCollapsed ? 'w-20' : 'w-72'} bg-white border-r border-gray-200 p-4 flex flex-col transition-all duration-300`}>
        <div className={`flex items-center ${sidebarCollapsed ? 'justify-center' : 'justify-between'} px-4 py-3 mb-6`}>
          {!sidebarCollapsed && (
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-xl flex items-center justify-center">
                <icons.GraduationCap size={20} className="text-white" />
              </div>
              <div>
                <h1 className="font-bold text-gray-900 font-display">EnrollAI Pro</h1>
                <p className="text-xs text-gray-500">Enrollment Platform</p>
              </div>
            </div>
          )}
          <button 
            onClick={() => setSidebarCollapsed(!sidebarCollapsed)}
            className="p-2 hover:bg-gray-100 rounded-lg transition-colors"
          >
            <icons.Menu size={18} className="text-gray-600" />
          </button>
        </div>

        <nav className="space-y-1 flex-1 overflow-y-auto">
          <NavItem icon={icons.Home} label="Dashboard" active={activeNav === 'dashboard'} onClick={() => setActiveNav('dashboard')} collapsed={sidebarCollapsed} />
          <NavItem icon={icons.Users} label="Prospects" active={activeNav === 'prospects'} onClick={() => setActiveNav('prospects')} badge="4" collapsed={sidebarCollapsed} />
          <NavItem icon={icons.FileText} label="Applications" active={activeNav === 'apps'} onClick={() => setActiveNav('apps')} collapsed={sidebarCollapsed} />
          <NavItem icon={icons.Target} label="Yield Management" active={activeNav === 'yield'} onClick={() => setActiveNav('yield')} collapsed={sidebarCollapsed} />
          <NavItem icon={icons.Mail} label="Communications" active={activeNav === 'comms'} onClick={() => setActiveNav('comms')} collapsed={sidebarCollapsed} />
          <NavItem icon={icons.Workflow} label="Automation" active={activeNav === 'automation'} onClick={() => setActiveNav('automation')} collapsed={sidebarCollapsed} />
          <NavItem icon={icons.BarChart3} label="Analytics" active={activeNav === 'analytics'} onClick={() => setActiveNav('analytics')} collapsed={sidebarCollapsed} />
          <NavItem icon={icons.Brain} label="Predictions" active={activeNav === 'predictions'} onClick={() => setActiveNav('predictions')} collapsed={sidebarCollapsed} />
          <NavItem icon={icons.DollarSign} label="Financial" active={activeNav === 'financial'} onClick={() => setActiveNav('financial')} collapsed={sidebarCollapsed} />
          <NavItem icon={icons.TrendingUp} label="Competitive" active={activeNav === 'competitive'} onClick={() => setActiveNav('competitive')} collapsed={sidebarCollapsed} />
          <NavItem icon={icons.Folder} label="Content" active={activeNav === 'content'} onClick={() => setActiveNav('content')} collapsed={sidebarCollapsed} />
          <NavItem icon={icons.Calendar} label="Events" active={activeNav === 'events'} onClick={() => setActiveNav('events')} collapsed={sidebarCollapsed} />
        </nav>

        <div className="border-t pt-4">
          <NavItem icon={icons.Settings} label="Settings" active={activeNav === 'settings'} onClick={() => setActiveNav('settings')} collapsed={sidebarCollapsed} />
        </div>
      </aside>

      {/* Main Content Area */}
      <main className="flex-1 overflow-auto">
        <header className="bg-white border-b border-gray-200 px-8 py-6 sticky top-0 z-10">
          <div className="flex items-center justify-between">
            <div>
              <h2 className="text-2xl font-bold text-gray-900 font-display">
                {activeNav === 'dashboard' ? 'Dashboard' :
                 activeNav === 'prospects' ? 'Prospect Management' :
                 activeNav === 'apps' ? 'Application Review' :
                 activeNav === 'yield' ? 'Yield Management' :
                 activeNav === 'comms' ? 'Communications Center' :
                 activeNav === 'automation' ? 'Marketing Automation' :
                 activeNav === 'analytics' ? 'Advanced Analytics' :
                 activeNav === 'predictions' ? 'Predictive Analytics' :
                 activeNav === 'financial' ? 'Financial Modeling' :
                 activeNav === 'competitive' ? 'Competitive Intelligence' :
                 activeNav === 'content' ? 'Content Library' :
                 activeNav === 'events' ? 'Events Management' :
                 'EnrollAI Pro'}
              </h2>
              <p className="text-gray-500 text-sm mt-1">
                {activeNav === 'dashboard' ? 'Welcome back, Megan! Here\'s your enrollment overview.' :
                 activeNav === 'prospects' ? 'Track and engage with prospective students' :
                 activeNav === 'apps' ? 'Process applications and make admission decisions' :
                 activeNav === 'yield' ? 'Convert admitted students into enrolled students' :
                 activeNav === 'comms' ? 'Manage all student communications' :
                 activeNav === 'automation' ? 'Build and monitor automated workflows' :
                 activeNav === 'analytics' ? 'Deep dive into performance metrics' :
                 activeNav === 'predictions' ? 'AI-powered enrollment forecasting' :
                 activeNav === 'financial' ? 'Revenue tracking and budget management' :
                 activeNav === 'competitive' ? 'Market intelligence and positioning' :
                 activeNav === 'content' ? 'Marketing assets and content performance' :
                 activeNav === 'events' ? 'Virtual and in-person event management' :
                 'Advanced enrollment management platform'}
              </p>
            </div>
            <div className="flex items-center gap-4">
              <div className="flex items-center gap-2 px-4 py-2 bg-gray-50 rounded-xl">
                <icons.Calendar size={16} className="text-gray-400" />
                <span className="text-sm font-medium text-gray-700">Dec 10, 2025</span>
              </div>
              <button className="relative p-2 text-gray-500 hover:bg-gray-100 rounded-xl transition-colors">
                <icons.Bell size={20} />
                {notificationCount > 0 && (
                  <span className="absolute top-0 right-0 w-5 h-5 bg-red-500 rounded-full flex items-center justify-center text-white text-xs font-bold">
                    {notificationCount > 9 ? '9+' : notificationCount}
                  </span>
                )}
              </button>
              <div className="w-10 h-10 bg-gradient-to-br from-indigo-400 via-purple-500 to-pink-500 rounded-xl flex items-center justify-center text-white font-bold cursor-pointer hover:scale-105 transition-transform shadow-lg">
                MP
              </div>
            </div>
          </div>
        </header>

        <div className="p-8">
          {activeNav === 'dashboard' && <Dashboard />}
          {activeNav === 'prospects' && (
            <div className="text-center py-20">
              <icons.Users size={64} className="mx-auto text-gray-300 mb-4" />
              <p className="text-gray-600 text-lg">Prospect Management module</p>
              <p className="text-gray-400 text-sm">Complete view created - see full implementation</p>
            </div>
          )}
          {!['dashboard', 'prospects'].includes(activeNav) && (
            <div className="bg-white rounded-2xl border border-gray-200 p-12 text-center">
              <icons.BookOpen size={64} className="mx-auto text-gray-300 mb-4" />
              <p className="text-gray-600 text-lg font-semibold mb-2">Module Under Development</p>
              <p className="text-gray-400 text-sm">This section contains extensive functionality - see documentation for details</p>
            </div>
          )}
        </div>
      </main>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
